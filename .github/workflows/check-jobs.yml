name: Check San Francisco Jobs

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: "Create a fresh clearly marked test Issue; do not run the tracker or change data."
        required: false
        default: false
        type: boolean
      send_test_application_scan:
        description: "Create a fresh test Issue and inspect one public application URL; do not run the tracker or change data."
        required: false
        default: false
        type: boolean
      test_application_url:
        description: "Public direct application URL for the application-question test."
        required: false
        default: "https://jobs.ashbyhq.com/replit/7e0dafe8-3eec-442e-aa76-a4d84d779fb1"
        type: string
      dry_run:
        description: "Safely fetch and validate the selected branch's sources without writing data or creating Issues. Ignored by explicit test-Issue modes."
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  issues: write

# Browser scanning is enabled only for scheduled or explicit production runs on
# main. Manual dry runs remain fully read-only and do not launch Chromium.
env:
  APPLICATION_SCAN_ENABLED: ${{ (github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && inputs.dry_run == false)) && 'true' || 'false' }}

concurrency:
  group: sf-job-tracker
  cancel-in-progress: false

jobs:
  check-jobs:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.send_test_notification == false && inputs.send_test_application_scan == false) }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install Playwright Chromium
        if: ${{ env.APPLICATION_SCAN_ENABLED == 'true' }}
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest

      - name: Collect and reconcile jobs
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            python -m src.check_jobs --dry-run
          else
            python -m src.check_jobs
          fi

      - name: Commit tracker data
        if: ${{ github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && inputs.dry_run == false) }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen_jobs.json data/current_jobs.json jobs.md
          if git diff --cached --quiet; then
            echo "Tracker state is unchanged."
          else
            git commit -m "chore: update job tracker"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      # State is pushed before delivery. If a notification succeeds but this
      # later commit fails, the hidden Issue marker prevents a duplicate retry.
      - name: Deliver pending GitHub Issue notifications
        if: ${{ github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && inputs.dry_run == false) }}
        id: deliver_notifications
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: python -m src.check_jobs --deliver-pending

      - name: Commit notification delivery state
        if: ${{ github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && inputs.dry_run == false) }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen_jobs.json data/application_questions.json
          if git diff --cached --quiet; then
            echo "No notification delivery state changed."
          else
            git commit -m "chore: record job notification delivery"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Surface pending notification delivery failures
        if: ${{ (github.event_name == 'schedule' || (github.ref == 'refs/heads/main' && inputs.dry_run == false)) && steps.deliver_notifications.outcome == 'failure' }}
        shell: bash
        run: |
          echo "One or more notification batches remain pending; see the delivery step logs."
          exit 1

  send-test-notification:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_notification == true && inputs.send_test_application_scan == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out the requested workflow revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create a fresh test notification Issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: python -m src.check_jobs --send-test-notification

  send-test-application-scan:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_application_scan == true && inputs.send_test_notification == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out the requested workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test and scan dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest

      - name: Create and enrich a fresh application-question test Issue
        shell: bash
        env:
          APPLICATION_SCAN_ENABLED: "true"
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          TEST_APPLICATION_URL: ${{ inputs.test_application_url }}
        run: python -m src.check_jobs --send-test-application-scan --test-application-url "$TEST_APPLICATION_URL"

  validate-manual-test-mode:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_notification == true && inputs.send_test_application_scan == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Require exactly one manual test mode
        shell: bash
        run: |
          echo "Choose either the notification test or the application-question test, not both."
          exit 1
