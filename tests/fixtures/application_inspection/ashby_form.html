<!doctype html>
<html>
  <body>
    <form aria-label="Ashby application">
      <label for="name">Name</label>
      <input id="name" name="name" required>

      <label for="auth">Are you legally authorized to work in the United States?</label>
      <select id="auth" name="authorization" required>
        <option value="">Select...</option>
        <option>Yes</option>
        <option>No</option>
      </select>

      <label for="why">Why are you interested in this role?</label>
      <textarea id="why" name="why"></textarea>
    </form>
  </body>
</html>
